name: chess-analysis
# OPTIONAL — only for local backend development with conda. The server/CI deploy
# uses a plain Python venv (see Jenkinsfile), not conda. conda-forge avoids the
# Anaconda 'defaults' channel Terms-of-Service prompt.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
