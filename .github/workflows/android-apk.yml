name: Android APK

# Build the Android APK (Capacitor wrapper around the Vite/React SPA) and, when
# triggered by a version tag, publish it to a GitHub Release.
#
#   • Push a tag like `v1.0.0`  → builds the APK and attaches it to a Release.
#   • "Run workflow" (manual)   → builds the APK and uploads it as a run artifact.
#
# Optional: set a repository variable `VITE_API_BASE` (Settings → Secrets and
# variables → Actions → Variables) to your deployed backend URL, otherwise the
# bundled app has no backend to talk to.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create/update Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Add Android platform & sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        working-directory: .
        run: |
          mkdir -p artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/chess-analysis-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-analysis-apk
          path: artifacts/chess-analysis-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/chess-analysis-debug.apk
          generate_release_notes: true
